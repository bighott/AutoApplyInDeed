<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flight Planner</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e7e9ee;
    --muted: #9aa3b2;
    --accent: #6d7cff;
    --accent-2: #4b59e0;
    --good: #2ecc71;
    --warn: #f5a524;
    --bad: #ff6b6b;
    --star: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2030 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 12px;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .wrap {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    padding: 16px 32px 40px;
    align-items: start;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; }
  input, select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 10px;
    font: inherit;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 12px; }

  .stop {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .stop .x {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    cursor: pointer; line-height: 1;
  }
  .stop .x:hover { color: var(--bad); border-color: var(--bad); }

  .btn {
    border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;
    padding: 10px 14px;
  }
  .btn-primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: white; width: 100%; padding: 12px; font-size: 15px; }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px dashed var(--line); width: 100%; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .inline { display: flex; align-items: center; gap: 8px; }
  .inline input[type=checkbox] { width: auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* results */
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--bad); background: #2a1a1d; border: 1px solid #5b2a2f; border-radius: 10px; padding: 12px 14px; }

  .best {
    border: 1px solid var(--accent-2);
    background: linear-gradient(180deg, rgba(109,124,255,.10), rgba(109,124,255,.02));
    border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }
  .best .total { font-size: 26px; font-weight: 700; }
  .best .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .leg { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .leg:first-of-type { border-top: 0; }
  .leg .route { font-weight: 600; }
  .leg .meta { color: var(--muted); font-size: 12.5px; }
  .leg .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .soldout { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .star { color: var(--star); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .section-title { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 12.5px; }
</style>
</head>
<body>
  <header>
    <h1>✈︎ Flight Planner</h1>
    <p>Multi-city, multi-day flexible-date search — finds the cheapest combination across your stay ranges.</p>
  </header>

  <div class="wrap">
    <!-- ============ FORM ============ -->
    <form id="form" class="card">
      <h2>Trip</h2>

      <div class="field">
        <label>Origin (IATA)</label>
        <input id="origin" value="SFO" maxlength="4" />
      </div>

      <div id="stops"></div>
      <button type="button" id="addStop" class="btn btn-ghost">+ Add stop</button>

      <div class="field inline" style="margin-top:14px">
        <input type="checkbox" id="returnToOrigin" checked />
        <label style="margin:0">Return to origin after last stop</label>
      </div>

      <div class="row">
        <div class="field">
          <label>Start date</label>
          <input id="startDate" type="date" value="2026-07-15" />
        </div>
        <div class="field">
          <label>Start flex (days)</label>
          <input id="startFlexDays" type="number" min="1" value="1" />
        </div>
      </div>

      <div class="row-3">
        <div class="field">
          <label>Adults</label>
          <input id="adults" type="number" min="1" value="1" />
        </div>
        <div class="field">
          <label>Cabin</label>
          <select id="cabin">
            <option>ECONOMY</option>
            <option>PREMIUMECONOMY</option>
            <option>BUSINESS</option>
            <option>FIRST</option>
          </select>
        </div>
        <div class="field">
          <label>Currency</label>
          <input id="currency" value="USD" maxlength="3" />
        </div>
      </div>

      <div class="field">
        <label>Price source</label>
        <select id="provider">
          <option value="mock">Mock — offline demo (no key needed)</option>
          <option value="serpapi">SerpApi — live Google Flights</option>
          <option value="crosscheck">Cross-check — SerpApi vs Expedia</option>
        </select>
        <div class="hint" id="providerHint"></div>
      </div>

      <button type="submit" id="run" class="btn btn-primary">Search flights</button>
    </form>

    <!-- ============ RESULTS ============ -->
    <div class="card" id="results">
      <h2>Results</h2>
      <div class="empty" id="empty">Build a trip and hit <b>Search flights</b>.</div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const money = (n, c) => n == null ? '—' : `${c} ${Number(n).toFixed(2)}`;

// ---- dynamic stops ----------------------------------------------------------
let stopSeq = 0;
function addStop(code = '', label = '', min = 2, max = 3) {
  const id = ++stopSeq;
  const el = document.createElement('div');
  el.className = 'stop';
  el.dataset.id = id;
  el.innerHTML = `
    <button type="button" class="x" title="Remove">✕</button>
    <div class="row">
      <div class="field" style="margin-bottom:8px">
        <label>Stop code (IATA)</label>
        <input class="s-code" value="${code}" maxlength="4" />
      </div>
      <div class="field" style="margin-bottom:8px">
        <label>Label (optional)</label>
        <input class="s-label" value="${label}" />
      </div>
    </div>
    <div class="row">
      <div class="field" style="margin-bottom:0">
        <label>Min nights</label>
        <input class="s-min" type="number" min="0" value="${min}" />
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Max nights</label>
        <input class="s-max" type="number" min="0" value="${max}" />
      </div>
    </div>`;
  el.querySelector('.x').onclick = () => {
    if (document.querySelectorAll('.stop').length > 1) el.remove();
  };
  $('stops').appendChild(el);
}
$('addStop').onclick = () => addStop();
// seed default trip
addStop('JFK', 'New York', 2, 3);
addStop('LHR', 'London', 3, 4);

// ---- provider hint ----------------------------------------------------------
const HINTS = {
  mock: 'Deterministic fake prices. Works for any route instantly — great for trying the UI.',
  serpapi: 'Real fares via your SERPAPI_KEY (in .env). One billed search per unique leg/date.',
  crosscheck: 'Prices SerpApi live vs the Expedia snapshot, picks the cheaper per leg. Expedia data only covers the seeded SFO/JFK/LHR July-2026 legs.',
};
function updateHint() { $('providerHint').textContent = HINTS[$('provider').value]; }
$('provider').onchange = updateHint;
updateHint();

// ---- gather + submit --------------------------------------------------------
function readSpec() {
  const stops = [...document.querySelectorAll('.stop')].map((el) => ({
    code: el.querySelector('.s-code').value.trim().toUpperCase(),
    label: el.querySelector('.s-label').value.trim() || undefined,
    minNights: Number(el.querySelector('.s-min').value),
    maxNights: Number(el.querySelector('.s-max').value),
  }));
  return {
    origin: $('origin').value.trim().toUpperCase(),
    stops,
    returnToOrigin: $('returnToOrigin').checked,
    startDate: $('startDate').value,
    startFlexDays: Number($('startFlexDays').value),
    adults: Number($('adults').value),
    cabin: $('cabin').value,
    currency: $('currency').value.trim().toUpperCase() || 'USD',
  };
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('run');
  btn.disabled = true; btn.textContent = 'Searching…';
  show(`<div class="empty"><span class="spinner"></span> Pricing legs…</div>`);
  try {
    const res = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ spec: readSpec(), provider: $('provider').value }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    render(data);
  } catch (err) {
    show(`<div class="error"><b>Error:</b> ${escapeHtml(err.message)}</div>`);
  } finally {
    btn.disabled = false; btn.textContent = 'Search flights';
  }
};

// ---- rendering --------------------------------------------------------------
function show(html) { $('results').innerHTML = `<h2>Results</h2>${html}`; }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

function legRow(l) {
  if (!l.quote) {
    return `<div class="leg"><div><div class="route">${l.origin}→${l.destination}</div>
      <div class="meta">${l.date}</div></div><div class="price soldout">no fare</div></div>`;
  }
  const q = l.quote;
  const meta = [
    q.airline,
    q.stops != null ? `${q.stops} stop${q.stops === 1 ? '' : 's'}` : '',
    q.durationLabel,
    q.bookingLabel,
    q.seatsLeft === 0 ? 'sold out at this fare' : '',
  ].filter(Boolean).join(' · ');
  return `<div class="leg"><div><div class="route">${l.origin}→${l.destination}
    <span class="meta">${l.date}</span></div><div class="meta">${escapeHtml(meta)}</div></div>
    <div class="price">${money(q.price, q.currency)}</div></div>`;
}

function render(data) {
  const { plan, spec, comparison } = data;
  const cur = spec.currency || 'USD';
  let html = '';

  if (!plan.best) {
    html += `<div class="error">No fully-priceable itinerary found across ${plan.queriesRun} searches. ` +
            `Some legs returned no fare (check codes/dates, or the source has no data for them).</div>`;
  } else {
    const b = plan.best;
    const nights = spec.stops.map((s, i) => `${s.label || s.code} ${b.nightsPerStop[i]}n`).join(' · ');
    html += `<div class="best">
      <div class="total">${money(b.total, cur)}</div>
      <div class="sub">Start ${b.startDate} · ${nights} · ${plan.queriesRun} searches</div>
      ${b.legs.map(legRow).join('')}
    </div>`;
  }

  // cross-check table
  if (comparison) {
    html += `<div class="section-title">Price cross-check (per leg)</div>`;
    html += `<table><thead><tr><th>Leg</th>` +
      comparison.providerNames.map((n) => `<th class="num">${n}</th>`).join('') +
      `<th class="num">Δ spread</th></tr></thead><tbody>`;
    for (const r of comparison.rows) {
      const cells = comparison.providerNames.map((n) => {
        const q = r.quotes[n];
        const star = n === r.cheapestProvider ? ' <span class="star">★</span>' : '';
        return `<td class="num">${money(q ? q.price : null, cur)}${star}</td>`;
      }).join('');
      html += `<tr><td>${r.leg.origin}→${r.leg.destination} <span class="meta">${r.leg.date}</span></td>` +
        cells + `<td class="num">${r.spread ? money(r.spread, cur) : '—'}</td></tr>`;
    }
    html += `</tbody></table>`;
    const tally = comparison.providerNames.map((n) => `${n}: ${comparison.winCounts[n]}`).join('  ·  ');
    html += `<div class="hint">Cheapest-source tally — ${tally}</div>`;
  }

  // alternatives
  if (plan.allItineraries.length > 1) {
    html += `<div class="section-title">Cheapest itineraries</div><table><thead><tr>` +
      `<th>#</th><th>Total</th><th>Start</th><th>Nights</th></tr></thead><tbody>`;
    html += plan.allItineraries.slice(0, 6).map((it, i) =>
      `<tr><td>${i + 1}</td><td class="num">${money(it.total, cur)}</td><td>${it.startDate}</td>` +
      `<td>[${it.nightsPerStop.join(', ')}]</td></tr>`).join('');
    html += `</tbody></table>`;
  }

  html += `<details><summary>Raw text plan</summary><pre>${escapeHtml(data.textPlan)}</pre></details>`;
  show(html);
}
</script>
</body>
</html>
